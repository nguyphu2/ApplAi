<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Sample Application Form</title>
</head>
<body>
  <h1>Sample Job Application</h1>
  <form>
    <label for="f1">Full Name</label><br />
    <input type="text" id="f1" name="fullName" /><br /><br />

    <label for="f2">Email Address</label><br />
    <input type="email" id="f2" name="email" /><br /><br />

    <label for="f3">Phone Number</label><br />
    <input type="tel" id="f3" name="phone" /><br /><br />

    <label for="f4">Work Authorization</label><br />
    <input type="text" id="f4" name="workAuth" placeholder="Are you authorized to work?" /><br /><br />

    <label for="f5">Favorite Programming Language</label><br />
    <input type="text" id="f5" name="favLang" />
  </form>
</body>
</html>

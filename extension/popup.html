<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #ffffff;
      --panel-bg-alt: #eef2fb;
      --blue: #3b82f6;
      --blue-bright: #1e50c4;
      --blue-dark: #16336e;
      --navy: #0a1f44;
      --text: #0a1330;
      --text-muted: #5b6580;
      --success: #1a7a4c;
      --bar-before: #9aa3b8;
      --amber: #9a6b00;
      --red: #b91c1c;
      --notch-sm: 4px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      width: 340px;
      margin: 0;
      padding: 1.1rem;
      font-family: "Press Start 2P", monospace;
      font-size: 0.65rem;
      line-height: 1.6;
      background: var(--bg);
      color: var(--text);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 1rem;
    }

    .brand img {
      width: 26px;
      height: 26px;
      image-rendering: pixelated;
    }

    .brand h1 {
      font-size: 0.75rem;
      font-weight: 400;
      color: var(--navy);
      margin: 0;
    }

    label {
      display: block;
      font-size: 0.58rem;
      color: var(--text-muted);
      margin: 0.9rem 0 0.4rem;
    }

    select {
      width: 100%;
      font-family: inherit;
      font-size: 0.6rem;
      padding: 0.6rem;
      border: 2px solid var(--navy);
      background: var(--bg);
      color: var(--text);
    }

    input[type="range"] {
      width: 100%;
    }

    .slider-value {
      font-size: 0.6rem;
      color: var(--text);
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 0.9rem;
      font-size: 0.6rem;
    }

    button {
      display: block;
      width: 100%;
      font-family: inherit;
      font-size: 0.62rem;
      line-height: 1.4;
      padding: 0.75rem 0.8rem;
      margin-top: 0.9rem;
      border: 3px solid var(--navy);
      background: var(--blue);
      color: #ffffff;
      cursor: pointer;
      clip-path: polygon(
        0 var(--notch-sm), var(--notch-sm) 0,
        calc(100% - var(--notch-sm)) 0, 100% var(--notch-sm),
        100% calc(100% - var(--notch-sm)), calc(100% - var(--notch-sm)) 100%,
        var(--notch-sm) 100%, 0 calc(100% - var(--notch-sm))
      );
      filter: drop-shadow(3px 3px 0 var(--navy));
      transition: transform 0.05s ease;
    }

    button:hover {
      background: var(--blue-dark);
    }

    button:active {
      transform: translate(3px, 3px);
      filter: drop-shadow(0 0 0 var(--navy));
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    button.secondary {
      background: var(--panel-bg-alt);
      color: var(--blue-bright);
      border-color: var(--blue);
    }

    button.danger {
      background: var(--bg);
      color: var(--red);
      border-color: var(--red);
      position: sticky;
      bottom: 0;
    }

    button.danger:hover {
      background: #fdecec;
    }

    .hidden {
      display: none;
    }

    .pixel-progress {
      display: flex;
      gap: 4px;
      margin-top: 0.9rem;
      padding: 0 2px;
    }

    .pixel-progress .cell {
      flex: 1 1 0;
      height: 16px;
      background: var(--panel-bg-alt);
      border: 1px solid var(--navy);
      clip-path: polygon(
        40% 0%, 100% 0%, 100% 25%, 90% 25%, 90% 50%, 80% 50%, 80% 75%, 70% 75%, 70% 100%,
        0% 100%, 0% 75%, 10% 75%, 10% 50%, 20% 50%, 20% 25%, 30% 25%, 30% 0%
      );
    }

    .pixel-progress .cell.active {
      background: var(--blue);
    }

    #result {
      margin-top: 1rem;
      padding-top: 0.9rem;
      border-top: 2px solid var(--panel-bg-alt);
      font-size: 0.6rem;
    }

    .bar-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.55rem;
      color: var(--text-muted);
      margin-bottom: 0.25rem;
    }

    .bar-track {
      width: 100%;
      height: 10px;
      background: var(--panel-bg-alt);
      border: 1px solid var(--navy);
      margin-bottom: 0.7rem;
    }

    .bar-fill {
      height: 100%;
    }

    .bar-fill.before {
      background: var(--bar-before);
    }

    .bar-fill.after {
      background: var(--blue);
    }

    #result details.dropdown {
      margin-top: 0.7rem;
      border: 1px solid var(--panel-bg-alt);
      padding: 0.45rem 0.55rem;
    }

    #result details.dropdown summary {
      cursor: pointer;
      font-size: 0.58rem;
      color: var(--text);
      font-weight: 700;
      outline: none;
    }

    #result details.dropdown ul {
      margin: 0.5rem 0 0;
      padding-left: 1rem;
    }

    #result details.dropdown li {
      margin-bottom: 0.35rem;
    }

    #result .missing-keywords li {
      color: var(--amber);
    }

    #result .red-flags li {
      color: var(--red);
    }

    #status {
      font-size: 0.55rem;
      line-height: 1.7;
      color: var(--text-muted);
      margin: 0.8rem 0 0;
    }
  </style>
</head>
<body>
  <div class="brand">
    <img src="icons/icon128.png" alt="ApplAI logo" />
    <h1>ApplAI Resume Optimizer</h1>
  </div>
  <button id="login-btn">Log in</button>

  <div id="optimizer-form" class="hidden">
    <label for="resume-select">Resume</label>
    <select id="resume-select"></select>

    <label for="match-slider">Target keyword match: <span id="match-slider-value" class="slider-value">70%</span></label>
    <input type="range" id="match-slider" min="0" max="100" value="70" />

    <div class="toggle-row">
      <label for="save-as-new-toggle" style="margin:0;">Save as new copy</label>
      <input type="checkbox" id="save-as-new-toggle" />
    </div>
    <div class="toggle-row">
      <label for="one-page-toggle" style="margin:0;">Keep to 1 page</label>
      <input type="checkbox" id="one-page-toggle" checked />
    </div>

    <button id="optimize-btn">Optimize</button>
    <div id="optimize-progress" class="pixel-progress hidden"></div>
  </div>

  <p id="not-job-description-page" class="hidden">This doesn't look like a job description page, so the optimizer is turned off here.</p>
  <p id="no-resumes" class="hidden">No DOCX resumes on your profile yet — upload one on the ApplAI website first.</p>

  <div id="result" class="hidden"></div>
  <p id="status"></p>
  <button id="logout-btn" class="danger hidden">Log out</button>
  <script src="popup.js"></script>
</body>
</html>

<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #ffffff;
      --panel-bg-alt: #eef2fb;
      --blue: #3b82f6;
      --blue-bright: #1e50c4;
      --blue-dark: #16336e;
      --navy: #0a1f44;
      --text: #0a1330;
      --text-muted: #5b6580;
      --border: #0a1f44;
      --success: #1a7a4c;
      --notch-sm: 4px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      width: 340px;
      margin: 0;
      padding: 1.1rem;
      font-family: "Press Start 2P", monospace;
      font-size: 0.65rem;
      line-height: 1.6;
      background: var(--bg);
      color: var(--text);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 1rem;
    }

    .brand img {
      width: 26px;
      height: 26px;
      image-rendering: pixelated;
    }

    .brand h1 {
      font-size: 0.8rem;
      font-weight: 400;
      color: var(--navy);
      margin: 0;
    }

    button {
      display: block;
      width: 100%;
      font-family: inherit;
      font-size: 0.62rem;
      line-height: 1.4;
      padding: 0.75rem 0.8rem;
      margin-top: 0.6rem;
      border: 3px solid var(--navy);
      background: var(--blue);
      color: #ffffff;
      cursor: pointer;
      clip-path: polygon(
        0 var(--notch-sm), var(--notch-sm) 0,
        calc(100% - var(--notch-sm)) 0, 100% var(--notch-sm),
        100% calc(100% - var(--notch-sm)), calc(100% - var(--notch-sm)) 100%,
        var(--notch-sm) 100%, 0 calc(100% - var(--notch-sm))
      );
      filter: drop-shadow(3px 3px 0 var(--navy));
      transition: transform 0.05s ease;
    }

    button:hover {
      background: var(--blue-dark);
    }

    button:active {
      transform: translate(3px, 3px);
      filter: drop-shadow(0 0 0 var(--navy));
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    button.secondary {
      background: var(--panel-bg-alt);
      color: var(--blue-bright);
      border-color: var(--blue);
    }

    button.secondary:hover {
      background: var(--panel-bg-alt);
      filter: drop-shadow(3px 3px 0 var(--navy)) brightness(0.97);
    }

    .hidden {
      display: none;
    }

    #fill-progress {
      margin-top: 1rem;
      padding-top: 0.9rem;
      border-top: 2px solid var(--panel-bg-alt);
    }

    .progress-block {
      margin-top: 0.9rem;
    }

    .progress-block:first-child {
      margin-top: 0;
    }

    .progress-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.58rem;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
    }

    .progress-count {
      color: var(--text);
    }

    .progress-track {
      height: 12px;
      border: 2px solid var(--navy);
      background: var(--panel-bg-alt);
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--blue);
      transition: width 0.35s ease;
    }

    .progress-fill.required {
      background: var(--blue-dark);
    }

    .progress-track.indeterminate .progress-fill {
      width: 35%;
      background: var(--blue);
      animation: applai-indeterminate 1s linear infinite;
    }

    @keyframes applai-indeterminate {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(285%); }
    }

    .fill-state {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.6rem;
    }

    .fill-state-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      border: 2px solid var(--navy);
      color: #ffffff;
      background: var(--blue);
      font-size: 0.55rem;
    }

    .fill-state-icon.done {
      background: var(--success);
    }

    #status {
      font-size: 0.55rem;
      line-height: 1.7;
      color: var(--text-muted);
      margin: 0.8rem 0 0;
    }
  </style>
</head>
<body>
  <div class="brand">
    <img src="icons/icon128.png" alt="ApplAI logo" />
    <h1>ApplAI Autofill</h1>
  </div>
  <button id="login-btn">Log in</button>
  <button id="logout-btn" class="secondary hidden">Log out</button>
  <button id="fill-btn" class="hidden">Fill this page</button>

  <div id="fill-progress" class="hidden">
    <div class="progress-block">
      <div class="fill-state">
        <span id="fill-state-icon" class="fill-state-icon">…</span>
        <span id="fill-state-label">Filling this page...</span>
      </div>
    </div>
    <div class="progress-block">
      <div class="progress-heading">
        <span>Fields answered</span>
        <span id="fields-progress-count" class="progress-count">0 / 0</span>
      </div>
      <div id="fields-progress-track" class="progress-track">
        <div id="fields-progress-fill" class="progress-fill"></div>
      </div>
    </div>
    <div class="progress-block">
      <div class="progress-heading">
        <span>Required fields</span>
        <span id="required-progress-count" class="progress-count">0 / 0</span>
      </div>
      <div id="required-progress-track" class="progress-track">
        <div id="required-progress-fill" class="progress-fill required"></div>
      </div>
    </div>
  </div>

  <p id="status"></p>
  <script src="popup.js"></script>
</body>
</html>
